<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor para otra flor 🌸</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        background: black;
    }
</style>
</head>

<body>

<canvas id="flor" width="700" height="700"></canvas>

<script>

const canvas = document.getElementById("flor");
const ctx = canvas.getContext("2d");

const W = 700;
const H = 700;

ctx.translate(W / 2, H / 2);

// --------------------------------------------------
// FUNCIONES AUXILIARES
// --------------------------------------------------

function hsvToRgb(h, s, v) {

    let r, g, b;

    const i = Math.floor(h * 6);
    const f = h * 6 - i;

    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);

    switch (i % 6) {

        case 0:
            r = v;
            g = t;
            b = p;
            break;

        case 1:
            r = q;
            g = v;
            b = p;
            break;

        case 2:
            r = p;
            g = v;
            b = t;
            break;

        case 3:
            r = p;
            g = q;
            b = v;
            break;

        case 4:
            r = t;
            g = p;
            b = v;
            break;

        case 5:
            r = v;
            g = p;
            b = q;
            break;
    }

    return `rgb(${r * 255}, ${g * 255}, ${b * 255})`;
}


// --------------------------------------------------
// DIBUJAR TALLO
// --------------------------------------------------

function dibujarTallo() {

    ctx.save();

    ctx.translate(0, -40);

    ctx.fillStyle = "green";

    ctx.beginPath();

    ctx.moveTo(0, 0);
    ctx.lineTo(0, 250);
    ctx.lineTo(10, 250);
    ctx.lineTo(10, 0);
    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


// --------------------------------------------------
// DIBUJAR CENTRO
// --------------------------------------------------

function dibujarCentro(cantidad) {

    const phi = 137.508 * Math.PI / 180;

    ctx.fillStyle = "brown";

    for (let i = 0; i < cantidad; i++) {

        const r = 2 * Math.sqrt(i);

        const theta = i * phi;

        const x = r * Math.cos(theta);
        const y = r * Math.sin(theta);

        ctx.save();

        ctx.translate(x, y);

        ctx.rotate(i * 137.508 * Math.PI / 180);

        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}


// --------------------------------------------------
// DIBUJAR UN PETALO
// --------------------------------------------------

function dibujarPetalo(radio, angulo) {

    ctx.save();

    ctx.rotate(angulo);

    ctx.beginPath();

    /*
       Esta parte reproduce la lógica de:

       rt(90)
       circle(...)
       lt(90)
       circle(...)
       rt(180)
    */

    ctx.moveTo(0, 0);

    ctx.arc(
        0,
        0,
        radio,
        -Math.PI / 2,
        Math.PI / 2,
        false
    );

    ctx.arc(
        0,
        0,
        radio,
        Math.PI / 2,
        3 * Math.PI / 2,
        false
    );

    ctx.strokeStyle = hsvToRgb(0.125, 1, 1);
    ctx.lineWidth = 1;

    ctx.stroke();

    ctx.restore();
}


// --------------------------------------------------
// DIBUJAR PETALOS
// --------------------------------------------------

function dibujarPetalos(cantidad) {

    let contador = 0;

    for (let i = 0; i < 16; i++) {

        const angulo = i * (2 * Math.PI / 16);

        for (let j = 0; j < 18; j++) {

            if (contador >= cantidad)
                return;

            const radio = 100 - j * 4;

            dibujarPetalo(radio, angulo);

            contador++;
        }
    }
}


// --------------------------------------------------
// MENSAJE
// --------------------------------------------------

function dibujarMensaje() {

    ctx.save();

    ctx.setTransform(1, 0, 0, 1, 0, 0);

    ctx.fillStyle = "white";

    ctx.textAlign = "center";

    ctx.font = "bold 25px Arial";

    ctx.fillText(
        "Una flor para otra flor",
        W / 2,
        45
    );

    ctx.fillStyle = "#FFD166";

    ctx.font = "bold 21px Arial";

    ctx.fillText(
        "Feliz 21 de septiembre 🌸",
        W / 2,
        75
    );

    ctx.restore();
}


// --------------------------------------------------
// ANIMACIÓN
// --------------------------------------------------

let petalos = 0;
let centros = 0;

function animar() {

    ctx.save();

    ctx.setTransform(1, 0, 0, 1, 0, 0);

    ctx.fillStyle = "black";

    ctx.fillRect(0, 0, W, H);

    ctx.restore();

    // Volver al centro
    ctx.save();

    ctx.translate(W / 2, H / 2);

    dibujarTallo();

    dibujarPetalos(petalos);

    dibujarCentro(centros);

    ctx.restore();

    dibujarMensaje();

    if (petalos < 288) {

        petalos += 2;

    } else if (centros < 200) {

        centros += 2;

    }

    if (petalos < 288 || centros < 200) {

        requestAnimationFrame(animar);

    } else {

        dibujarMensaje();
    }
}


// --------------------------------------------------
// COMENZAR
// --------------------------------------------------

animar();

</script>

</body>
</html>
