<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor para otra flor 🌸</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    canvas {
        width: min(100vw, 700px);
        height: min(100vw, 700px);
        background: black;
    }
</style>
</head>

<body>

<canvas id="flor" width="700" height="700"></canvas>

<script>
const canvas = document.getElementById("flor");
const ctx = canvas.getContext("2d");

const escala = 1;
const centroX = 350;
const centroY = 350;

// ----------------------------------------------------
// COLORES
// Equivalente a colorsys.hsv_to_rgb(0.125, 1, 1)
// ----------------------------------------------------

function hsvToRgb(h, s, v) {

    let r, g, b;

    const i = Math.floor(h * 6);
    const f = h * 6 - i;

    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);

    switch (i % 6) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        case 5: r = v; g = p; b = q; break;
    }

    return `rgb(${Math.round(r * 255)},
                ${Math.round(g * 255)},
                ${Math.round(b * 255)})`;
}


// ----------------------------------------------------
// ESTADO DEL "TURTLE"
// ----------------------------------------------------

let turtle = {
    x: 0,
    y: 0,
    heading: 0
};


// ----------------------------------------------------
// CONVERSIÓN DE COORDENADAS
// Turtle usa Y positivo hacia arriba.
// Canvas usa Y positivo hacia abajo.
// ----------------------------------------------------

function canvasX(x) {
    return centroX + x;
}

function canvasY(y) {
    return centroY - y;
}


// ----------------------------------------------------
// GOTO
// ----------------------------------------------------

function gotoTurtle(x, y) {
    turtle.x = x;
    turtle.y = y;
}


// ----------------------------------------------------
// SETHEADING
// ----------------------------------------------------

function setheading(grados) {
    turtle.heading = grados;
}


// ----------------------------------------------------
// ROTACIONES
// ----------------------------------------------------

function rt(grados) {
    turtle.heading -= grados;
}

function lt(grados) {
    turtle.heading += grados;
}


// ----------------------------------------------------
// FORWARD
// ----------------------------------------------------

function fd(distancia) {

    const rad = turtle.heading * Math.PI / 180;

    turtle.x += Math.cos(rad) * distancia;
    turtle.y += Math.sin(rad) * distancia;
}


// ----------------------------------------------------
// CIRCLE
//
// Esta función intenta reproducir el comportamiento
// de turtle.circle(radius, extent).
// ----------------------------------------------------

function circle(radius, extent) {

    const pasos = Math.max(2, Math.ceil(Math.abs(extent) / 3));

    const incremento = extent / pasos;

    for (let i = 0; i < pasos; i++) {

        const angulo1 =
            turtle.heading * Math.PI / 180;

        const x1 = turtle.x;
        const y1 = turtle.y;

        // Movimiento aproximado sobre el arco.
        turtle.heading += incremento;

        const angulo2 =
            turtle.heading * Math.PI / 180;

        const distancia =
            Math.abs(radius) *
            Math.abs(incremento) *
            Math.PI / 180;

        turtle.x += Math.cos(angulo2) * distancia;
        turtle.y += Math.sin(angulo2) * distancia;

        ctx.lineTo(
            canvasX(turtle.x),
            canvasY(turtle.y)
        );
    }
}


// ----------------------------------------------------
// DIBUJAR LOS PÉTALOS
//
// Basado directamente en:
//
// goto(0,-40)
//
// for i in range(16):
//     for j in range(18):
//         rt(90)
//         circle(...,90)
//         lt(90)
//         circle(...,90)
//         rt(180)
//
//     circle(40,24)
// ----------------------------------------------------

function dibujarPetalos() {

    gotoTurtle(0, -40);

    ctx.lineWidth = 1;

    for (let i = 0; i < 16; i++) {

        for (let j = 0; j < 18; j++) {

            const c =
                hsvToRgb(0.125, 1, 1);

            ctx.strokeStyle = c;

            ctx.beginPath();

            ctx.moveTo(
                canvasX(turtle.x),
                canvasY(turtle.y)
            );

            rt(90);

            circle(
                100 - j * 4,
                90
            );

            lt(90);

            circle(
                100 - j * 4,
                90
            );

            rt(180);

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.moveTo(
            canvasX(turtle.x),
            canvasY(turtle.y)
        );

        circle(40, 24);

        ctx.strokeStyle =
            hsvToRgb(0.125, 1, 1);

        ctx.stroke();
    }
}


// ----------------------------------------------------
// CENTRO DE LA FLOR
//
// Basado directamente en:
//
// phi = 137.508°
//
// r = 2 * sqrt(i)
// theta = i * phi
// stamp()
// ----------------------------------------------------

function dibujarCentro() {

    const phi =
        137.508 * Math.PI / 180;

    for (let i = 0; i < 200; i++) {

        const r =
            2 * Math.sqrt(i);

        const theta =
            i * phi;

        const x =
            r * Math.cos(theta);

        const y =
            r * Math.sin(theta);

        ctx.save();

        ctx.translate(
            canvasX(x),
            canvasY(y)
        );

        ctx.rotate(
            -(i * 137.508) * Math.PI / 180
        );

        // Representación del stamp de Turtle
        ctx.fillStyle = "brown";

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            4,
            6,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


// ----------------------------------------------------
// TALLO
// ----------------------------------------------------

function dibujarTallo() {

    gotoTurtle(0, -40);

    setheading(270);

    const puntos = [];

    puntos.push([
        turtle.x,
        turtle.y
    ]);

    fd(250);

    puntos.push([
        turtle.x,
        turtle.y
    ]);

    lt(90);

    fd(10);

    puntos.push([
        turtle.x,
        turtle.y
    ]);

    lt(90);

    fd(250);

    puntos.push([
        turtle.x,
        turtle.y
    ]);

    lt(90);

    fd(10);

    puntos.push([
        turtle.x,
        turtle.y
    ]);

    ctx.fillStyle = "green";

    ctx.beginPath();

    ctx.moveTo(
        canvasX(puntos[0][0]),
        canvasY(puntos[0][1])
    );

    for (let i = 1; i < puntos.length; i++) {

        ctx.lineTo(
            canvasX(puntos[i][0]),
            canvasY(puntos[i][1])
        );
    }

    ctx.closePath();

    ctx.fill();
}


// ----------------------------------------------------
// CUADRO Y MENSAJE
// ----------------------------------------------------

function dibujarCuadroTexto() {

    ctx.fillStyle = "black";

    ctx.fillRect(
        centroX - 250,
        centroY - 220,
        300,
        50
    );

    ctx.fillStyle = "white";

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign = "left";

    ctx.fillText(
        "Una flor para otra flor",
        centroX - 180,
        centroY - 195
    );

    ctx.fillStyle = "#FFD166";

    ctx.fillText(
        "Feliz 21 de septiembre",
        centroX - 180,
        centroY - 173
    );
}


// ----------------------------------------------------
// DIBUJO
// ----------------------------------------------------

function dibujarTodo() {

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    dibujarCuadroTexto();

    dibujarTallo();

    dibujarCentro();

    dibujarPetalos();
}


// ----------------------------------------------------
// COMENZAR
// ----------------------------------------------------

dibujarTodo();

</script>

</body>
</html>
